[project]
name = "living-review-updater"
version = "0.1.0"
description = "Keep a systematic review up to date: rank/flag newly-found studies using your own prior screening decisions. Ranks for human review; never auto-excludes."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Matt Ebso" }]
keywords = ["systematic-review", "living-review", "evidence-synthesis", "asreview", "screening", "meta-analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Healthcare Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "scikit-learn>=1.3",
    "numpy>=1.24",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "rapidfuzz>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/mattebso/living-review-updater"
Repository = "https://github.com/mattebso/living-review-updater"
Issues = "https://github.com/mattebso/living-review-updater/issues"
Changelog = "https://github.com/mattebso/living-review-updater/blob/main/CHANGELOG.md"

[project.scripts]
living-review = "livingreview.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["livingreview*"]
