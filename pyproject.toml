[project]
name = "living-review-updater"
version = "0.0.1"
description = "Keep a systematic review up to date: rank/flag newly-found studies using your own prior screening decisions. Ranks for human review; never auto-excludes."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Matt Ebso" }]
keywords = ["systematic-review", "living-review", "evidence-synthesis", "asreview", "screening", "meta-analysis"]
dependencies = [
    "scikit-learn>=1.3",
    "numpy>=1.24",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "rapidfuzz>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
living-review = "livingreview.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["livingreview*"]
